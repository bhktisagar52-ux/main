<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question for You ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff4d6d;
            --secondary-color: #c9184a;
            --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            --white: #ffffff;
            --text-color: #590d22;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            touch-action: none; 
        }

        #bg-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: var(--white);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 400px;
            transition: transform 0.3s ease, opacity 0.5s ease;
            margin-bottom: 60px;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: var(--text-color);
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        p {
            font-size: 1.1rem;
            color: #800f2f;
            margin-bottom: 1.5rem;
        }

        .cute-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-color);
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 1.5rem;
            position: relative;
            height: 65px; 
            width: 100%;
        }

        .btn {
            width: 120px;
            height: 50px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            outline: none;
            box-sizing: border-box;
            white-space: nowrap;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Keep emoji inside button */
            position: relative;
        }

        /* YES BUTTON SPECIFIC STYLES */
        .btn-yes {
            background-color: var(--primary-color);
            color: white;
            z-index: 2;
            margin-right: 60px; 
            /* Make sure button expands slightly to fit emoji if needed */
            min-width: 140px; 
        }

        .btn-yes:active {
            transform: scale(0.95);
        }

        /* The Happy Emoji inside Yes Button */
        .happy-emoji {
            position: absolute;
            left: -30px; /* Start hidden to the left */
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.4rem;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
        }

        /* Hover Effect for Yes Button: Show Emoji and expand text slightly */
        .btn-yes:hover .happy-emoji {
            left: 10px; /* Slide in */
            opacity: 1;
        }

        .btn-yes:hover {
            padding-left: 35px; /* Make room for the emoji */
            background-color: var(--secondary-color);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(201, 24, 74, 0.4);
        }

        /* Click Animation for Yes Button */
        .btn-yes.clicked {
            animation: popButton 0.4s ease;
        }

        @keyframes popButton {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* NO BUTTON */
        .btn-no {
            background-color: #e0e0e0;
            color: #555;
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(10px);
            z-index: 1;
        }

        @media (max-width: 350px) {
            .btn { width: 100px; height: 45px; font-size: 1rem; }
            .btn-yes { margin-right: 0; min-width: 120px; }
            .btn-no { transform: translateX(60px); }
            .happy-emoji { font-size: 1.2rem; left: -25px; }
            .btn-yes:hover .happy-emoji { left: 5px; }
            .btn-yes:hover { padding-left: 25px; }
        }

        @media (min-width: 500px) {
            .container { padding: 3rem; width: 500px; margin-bottom: 40px; }
            h1 { font-size: 3.5rem; }
            .cute-img { width: 150px; height: 150px; }
            .btn { font-size: 1.2rem; width: 130px; height: 55px; }
            .btn-yes { min-width: 160px; }
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            color: rgba(89, 13, 34, 0.8);
            z-index: 20;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 8px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            font-family: 'Nunito', sans-serif;
            pointer-events: none;
        }

        /* Success Screen */
        .success-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(2px);
            z-index: 100;
            animation: fadeIn 1s ease forwards;
        }

        .success-screen h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        .success-screen p {
            font-size: 1.5rem;
            color: var(--text-color);
            animation: slideUp 1s ease forwards 0.3s;
            opacity: 0;
            padding: 0 20px;
        }

        .heart-beat {
            font-size: 8rem;
            color: var(--primary-color);
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .bg-heart {
            position: absolute;
            color: rgba(255, 77, 109, 0.2);
            animation: floatUp linear infinite;
            z-index: 0;
            user-select: none;
            pointer-events: none;
            bottom: -50px;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="bg-hearts"></div>

    <div class="container" id="proposal-card">
        <img src="https://picsum.photos/seed/lovebear/200/200" alt="Cute Teddy" class="cute-img">
        
        <h1>My Dearest Love...</h1>
        <p>I promise to love you forever, to make you smile, and to be your best friend.</p>
        <h2>Will you marry me?</h2>

        <div class="btn-group">
            <button class="btn btn-yes" id="yesBtn">
                <span class="happy-emoji">😊</span>
                YES! ❤️
            </button>
            <button class="btn btn-no" id="noBtn">No</button>
        </div>
    </div>

    <div class="footer">
        &copy; 2026 Abhishek Bajpai. All Rights Reserved.
    </div>

    <div class="success-screen" id="success-screen">
        <div class="heart-beat">❤️</div>
        <h1>She Said YES!</h1>
        <p>I'm the luckiest person in the world.</p>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const proposalCard = document.getElementById('proposal-card');
        const successScreen = document.getElementById('success-screen');
        const bgContainer = document.getElementById('bg-hearts');

        function createFloatingHearts() {
            const heartSymbols = ['❤️', '💖', '💕', '🌸', '💓'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('bg-heart');
                heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                
                heart.style.left = Math.random() * 100 + 'vw';
                
                const size = Math.random() * 20 + 20;
                heart.style.fontSize = size + 'px';
                
                const duration = Math.random() * 3 + 4;
                heart.style.animationDuration = duration + 's';
                
                bgContainer.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, duration * 1000);

            }, 400);
        }

        function moveButton() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            const newLeft = Math.random() * (windowWidth - btnWidth - 20);
            const newTop = Math.random() * (windowHeight - btnHeight - 20);

            if (noBtn.style.position !== 'fixed') {
                noBtn.style.position = 'fixed';
            }

            noBtn.style.left = `${newLeft}px`;
            noBtn.style.top = `${newTop}px`;
            
            noBtn.style.right = 'auto';
            noBtn.style.transform = 'none';
        }

        noBtn.addEventListener('mouseover', moveButton);

        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });
        
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveButton();
        });

        yesBtn.addEventListener('click', () => {
            // Add click animation class
            yesBtn.classList.add('clicked');
            
            // Wait slightly for the animation to be seen before showing success screen
            setTimeout(() => {
                proposalCard.style.display = 'none';
                successScreen.style.display = 'flex';
                launchConfetti();
            }, 300);
        });

        yesBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            yesBtn.click(); 
        });

        function launchConfetti() {
            const duration = 5000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff4d6d', '#ff8fa3', '#fff0f3', '#ffb3c1']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff4d6d', '#ff8fa3', '#fff0f3', '#ffb3c1']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        createFloatingHearts();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</body>
</html>
