<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question for You ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff4d6d;
            --secondary-color: #c9184a;
            --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%);
            --white: #ffffff;
            --text-color: #590d22;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            touch-action: none; 
        }

        /* Background Hearts Container */
        #bg-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; /* Behind everything */
            pointer-events: none;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: var(--white);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10; /* Above background */
            width: 90%;
            max-width: 400px;
            transition: transform 0.3s ease, opacity 0.5s ease;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: var(--text-color);
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        p {
            font-size: 1.1rem;
            color: #800f2f;
            margin-bottom: 1.5rem;
        }

        .cute-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-color);
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 1.5rem;
            position: relative;
            height: 65px; 
            width: 100%;
        }

        .btn {
            width: 120px;
            height: 50px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            outline: none;
            box-sizing: border-box;
            white-space: nowrap;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .btn-yes {
            background-color: var(--primary-color);
            color: white;
            position: relative;
            z-index: 2;
            margin-right: 60px; 
        }

        .btn-yes:active {
            transform: scale(0.95);
        }

        .btn-no {
            background-color: #e0e0e0;
            color: #555;
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(10px);
            z-index: 1;
        }

        @media (max-width: 350px) {
            .btn { width: 100px; height: 45px; font-size: 1rem; }
            .btn-yes { margin-right: 0; }
            .btn-no { transform: translateX(60px); }
        }

        @media (min-width: 500px) {
            .container { padding: 3rem; width: 500px; }
            h1 { font-size: 3.5rem; }
            .cute-img { width: 150px; height: 150px; }
            .btn { font-size: 1.2rem; width: 130px; height: 55px; }
        }

        .success-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Semi-transparent white so you can see the hearts behind it */
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(2px);
            z-index: 100;
            animation: fadeIn 1s ease forwards;
        }

        .success-screen h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        .success-screen p {
            font-size: 1.5rem;
            color: var(--text-color);
            animation: slideUp 1s ease forwards 0.3s;
            opacity: 0;
            padding: 0 20px;
        }

        .heart-beat {
            font-size: 8rem;
            color: var(--primary-color);
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .bg-heart {
            position: absolute;
            color: rgba(255, 77, 109, 0.2);
            animation: floatUp linear infinite;
            z-index: 0;
            user-select: none;
            pointer-events: none;
            bottom: -50px; /* Start below screen */
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-120vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Background Hearts (Fixed Container) -->
    <div id="bg-hearts"></div>

    <div class="container" id="proposal-card">
        <img src="https://picsum.photos/seed/lovebear/200/200" alt="Cute Teddy" class="cute-img">
        
        <h1>My Dearest Love...</h1>
        <p>I promise to love you forever, to make you smile, and to be your best friend.</p>
        <h2>Will you marry me?</h2>

        <div class="btn-group">
            <button class="btn btn-yes" id="yesBtn">YES! ❤️</button>
            <button class="btn btn-no" id="noBtn">No</button>
        </div>
    </div>

    <div class="success-screen" id="success-screen">
        <div class="heart-beat">❤️</div>
        <h1>She Said YES!</h1>
        <p>I'm the luckiest person in the world.</p>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const proposalCard = document.getElementById('proposal-card');
        const successScreen = document.getElementById('success-screen');
        const bgContainer = document.getElementById('bg-hearts');

        // --- Create Floating Hearts Logic ---
        function createFloatingHearts() {
            const heartSymbols = ['❤️', '💖', '💕', '🌸', '💓'];
            
            // Create a new heart every 300ms indefinitely
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('bg-heart');
                heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                
                // Random horizontal position
                heart.style.left = Math.random() * 100 + 'vw';
                
                // Random size
                const size = Math.random() * 20 + 20;
                heart.style.fontSize = size + 'px';
                
                // Random duration (speed)
                const duration = Math.random() * 3 + 4; // 4 to 7 seconds
                heart.style.animationDuration = duration + 's';
                
                // Append to body to ensure it persists even if card is hidden
                bgContainer.appendChild(heart);

                // Remove heart from DOM after animation finishes to save memory
                setTimeout(() => {
                    heart.remove();
                }, duration * 1000);

            }, 400); // Frequency of hearts
        }

        // --- Move "No" Button Logic ---
        function moveButton() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            const newLeft = Math.random() * (windowWidth - btnWidth - 20);
            const newTop = Math.random() * (windowHeight - btnHeight - 20);

            if (noBtn.style.position !== 'fixed') {
                noBtn.style.position = 'fixed';
            }

            noBtn.style.left = `${newLeft}px`;
            noBtn.style.top = `${newTop}px`;
            
            noBtn.style.right = 'auto';
            noBtn.style.transform = 'none';
        }

        // Desktop Events
        noBtn.addEventListener('mouseover', moveButton);

        // Mobile Events
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });
        
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveButton();
        });

        // --- Yes Button Logic ---
        yesBtn.addEventListener('click', () => {
            proposalCard.style.display = 'none';
            successScreen.style.display = 'flex';
            launchConfetti();
        });

        yesBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            yesBtn.click(); 
        });

        // --- Confetti Logic ---
        function launchConfetti() {
            const duration = 5000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff4d6d', '#ff8fa3', '#fff0f3', '#ffb3c1']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff4d6d', '#ff8fa3', '#fff0f3', '#ffb3c1']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // Start the animation when page loads
        createFloatingHearts();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</body>
</html>
